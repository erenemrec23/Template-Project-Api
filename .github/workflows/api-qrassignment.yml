name: Build and deploy .NET Core application to Web App api-qrassignment

on:
  workflow_dispatch:
  push:
    branches:
      - main  # Sadece main dalını dinliyoruz

env:
  AZURE_WEBAPP_NAME: api-qrassignment
  AZURE_WEBAPP_PACKAGE_PATH: '${{ github.workspace }}/publish'
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 10.0.x

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}

      # 1. DEĞİŞİKLİK: .sln aramak yerine doğrudan projeyi restore ediyoruz
      - name: Restore
        run: dotnet restore "TemplateProject.WebApi/QrAssignment.WebApi.csproj"

      # 2. DEĞİŞİKLİK: .sln yerine doğrudan projeyi derliyoruz
      - name: Build
        run: dotnet build "TemplateProject.WebApi/QrAssignment.WebApi.csproj" --configuration ${{ env.CONFIGURATION }} --no-restore

      # 3. DEĞİŞİKLİK: --no-build PARAMETRESİ KALDIRILDI! 
      - name: Publish
        run: dotnet publish "TemplateProject.WebApi/QrAssignment.WebApi.csproj" --configuration ${{ env.CONFIGURATION }} --output ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Publish Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
